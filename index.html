<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantanucleo Market 26/27</title>
    <meta name="description" content="Ricerca Calciatori, Possesso Squadre e Crediti — Fantanucleo Market 26/27">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
    <div class="logo">
        <span class="logo-icon">⚽</span>
        <span class="logo-text">Fantanucleo <span class="badge-market">MARKET</span> <span class="dim">26/27</span></span>
    </div>

    <nav class="tabs">
        <button class="t active" data-v="giocatori">
            <span class="tab-icon">🔍</span> Giocatori
        </button>
        <button class="t" data-v="mercato">
            <span class="tab-icon">💰</span> Crediti & Cambi
        </button>
    </nav>

    <div class="bar-right">
        <div class="gn-nav">
            <button class="gn-btn" id="gnPrev" title="Giornata precedente" aria-label="Giornata precedente">‹</button>
            <button class="gn-label" id="gnLabel" title="Seleziona giornata" aria-label="Seleziona giornata">G1 <span class="gn-arrow">▾</span></button>
            <button class="gn-btn" id="gnNext" title="Giornata successiva" aria-label="Giornata successiva">›</button>
        </div>
    </div>
</header>

<!-- picker giornate -->
<div class="picker" id="picker"></div>

<main>

    <!-- GIOCATORI & POSSESSO -->
    <section class="v on" id="v-giocatori">
        <div class="toolbar-card">
            <div class="search-wrap">
                <div class="search-input-box">
                    <span class="search-icon">🔍</span>
                    <input id="qGio" type="search" class="search" placeholder="Cerca calciatore o squadra Serie A…">
                    <button id="searchClearGio" class="search-clear" aria-label="Cancella ricerca" title="Cancella ricerca">✕</button>
                </div>
                <span class="cnt-badge" id="cntGio"></span>
            </div>

            <div class="filter-row">
                <div class="pill-group">
                    <span class="filter-label">Ruolo:</span>
                    <button class="pill-gio-r pill on" data-r="">Tutti <span class="pill-cnt" id="cnt-gio-all"></span></button>
                    <button class="pill-gio-r pill pp" data-r="P">P <span class="pill-cnt" id="cnt-gio-p"></span></button>
                    <button class="pill-gio-r pill pd" data-r="D">D <span class="pill-cnt" id="cnt-gio-d"></span></button>
                    <button class="pill-gio-r pill pc" data-r="C">C <span class="pill-cnt" id="cnt-gio-c"></span></button>
                    <button class="pill-gio-r pill pa" data-r="A">A <span class="pill-cnt" id="cnt-gio-a"></span></button>
                </div>

                <div class="pill-group">
                    <span class="filter-label">Stato:</span>
                    <button class="pill-gio-s pill on" data-st="">Tutti</button>
                    <button class="pill-gio-s pill st-svinc" data-st="svincolato">Svincolati</button>
                    <button class="pill-gio-s pill st-poss" data-st="posseduto">Posseduti</button>
                </div>

                <button id="btnResetGio" class="btn-reset-filters" style="display:none;" aria-label="Reset filtri" title="Reset filtri">✕ Reset filtri</button>
            </div>
        </div>

        <div class="box full-box">
            <div class="scroll">
                <table id="tGiocatori">
                    <thead><tr>
                        <th>R</th>
                        <th>Nome</th>
                        <th>Squadra</th>
                        <th class="n">Quot (cr)</th>
                        <th>Possesso</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="gioEmpty" class="empty-state" style="display:none;">
                <span>🔎</span>
                <p>Nessun calciatore trovato con i filtri correnti</p>
            </div>
        </div>
    </section>

    <!-- MERCATO -->
    <section class="v" id="v-mercato">
        <div class="mercato-note" id="mercatoNote"></div>
        <div class="box">
            <div class="scroll">
                <table id="tCambi">
                    <thead><tr>
                        <th>Squadra</th>
                        <th class="n">Cambi rimasti</th>
                        <th class="n">Crediti residui</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </section>

</main>

<script src="app.js"></script>
</body>
</html>
